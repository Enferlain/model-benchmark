name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Frontend Dependencies
        run: npm install

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          # Only install core requirements for CI run
          # Skipping heavy ML libs for speed/timeout issues in standard runners
          # but ensuring ruff works.
          cd backend && pip install fastapi uvicorn pydantic sqlmodel

      - name: Run Global Quality Checks
        run: npm run check:all
